# portals.yml — Target companies and geography for job_scanner.py
# Each entry: company name, careers page URL, HQ country, relevant verticals
# Scanner uses target_companies from ~/.claude-job-profile.json for filtering;
# this file provides direct career page URLs for JD extraction in the /job-search skill.

geography:
  primary:
    - ae    # UAE / Dubai
    - gb    # United Kingdom
    - de    # Germany
    - nl    # Netherlands
  secondary:
    - be    # Belgium
    - fr    # France
    - se    # Sweden
    - at    # Austria
    - fi    # Finland
    - ee    # Estonia

# ── Target Companies ─────────────────────────────────────────────────
# Grouped by vertical. careers_url points to the company's own job board.

